parallel:
  fully_shard_parallel_size: auto
  fsdp_plan:
    apply_modules:
    - model.visual
    - model.visual.blocks.{*}
    - model.language_model.embed_tokens
    - model.language_model
    - model.language_model.layers.{*}
    - lm_head
    - mtp
    param_dtype: bf16
    reduce_dtype: fp32
    num_to_forward_prefetch: 1
    num_to_backward_prefetch: 1
  ulysses_parallel_size: 1
data:
  dataset_param:
    dataset_type: huggingface
    attr:
      images: images
      messages: messages
      role_tag: role
      content_tag: content
      user_tag: user
      assistant_tag: assistant
    preprocess_parameters:
      model_name_or_path: /workspace/mnt/share/weights/Qwen3.5-0.8B
      use_fast_tokenizer: true
      split_special_tokens: false
      image_max_pixels: 262144
      image_min_pixels: 1024
      video_max_pixels: 16384
      video_min_pixels: 0
      video_fps: 2.0
      video_maxlen: 64
    basic_parameters:
      cutoff_len: 1024
      template: qwen3_vl_nothink
      enable_thinking: false
      train_on_prompt: false
      mask_history: false
      dataset_dir: /workspace/kaoyan-lab/kaoyan-knowledge-agent/ascend
      dataset:
      - /workspace/kaoyan-lab/kaoyan-knowledge-agent/ascend/annotations_rag_v2_train.json
      cache_dir: /workspace/kaoyan-lab/cache/qwen35-0p8b-rag-sft-v2
      overwrite_cache: true
      preprocess_on_fly: true
      preprocessing_batch_size: 1000
      preprocessing_num_workers: 1
      max_samples: 165
      val_dataset: /workspace/kaoyan-lab/kaoyan-knowledge-agent/ascend/annotations_rag_v2_val.json
      val_max_samples: 38
      val_rate: null
  dataloader_param:
    pin_memory: true
    shuffle: true
    dataloader_mode: sampler
    drop_last: true
    sampler_type: BaseRandomBatchSampler
    num_workers: 0
    collate_param:
      model_name: qwen3vl
      ignore_pad_token_for_loss: true
    enable_preload: false
model:
  model_id: qwen3_5
  model_name_or_path: /workspace/mnt/share/weights/Qwen3.5-0.8B
  trust_remote_code: true
  attn_implementation: eager
  gdn_implementation: eager
  causal_conv1d_implementation: eager
  skip_gdn_recompute: false
  skip_flash_attn_recompute: false
features:
  loss_cfg:
    loss_type: default
    router_aux_loss_coef: 0.0
  recompute: false
  recompute_plan:
    apply_modules:
    - model.visual.blocks.{*}
    - model.language_model.layers.{*}
  enable_chunk_loss: false
  chunkloss_plan:
    apply_module: lm_head
    chunk_size: 1024
  enable_activation_offload: false
  activation_offload_plan:
    apply_modules:
    - model.visual.blocks.{*}
    - model.language_model.layers.{*}
  enable_chunk_mbs: false
  chunkmbs_plan:
    apply_modules:
    - model.language_model.layers.{*}
    chunk_mbs: 2
    batch_dim: 0
    chunk_arg_indexs:
    - 0
    chunk_kwarg_names:
    - position_embeddings
    - position_ids
    - rope_deltas
    - attention_mask
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  seed: 42
  lr: 5.0e-07
  lr_decay_style: cosine
  lr_warmup_ratio: 0.1
  weight_decay: 0.0
  train_iters: 82
  clip_grad: 1.0
  init_model_with_meta_device: true
  optimizer: adamw
  adam_fused: true
  save_interval: 20
  no_load_optim: true
  no_load_rng: true
  no_save_optim: true
  no_save_rng: true
  load: /workspace/mnt/share/weights/Qwen3.5-0.8B
  load_format: auto
  save: /workspace/kaoyan-lab/runs/qwen35-0p8b-rag-sft-v2
  save_format: dcp
  use_deter_comp: false
  plugin:
  - mindspeed_mm/fsdp/models/qwen3_5/modeling_qwen3_5
  - mindspeed_mm/fsdp/data/datasets/huggingface
  lr_start: 0.0
  lr_min: 0.0
  val_interval: 20
  val_micro_batch_size: 1
tools:
  profile:
    enable: false
    profile_type: static
    ranks:
    - 0
    static_param:
      level: level1
      with_stack: false
      with_memory: false
      record_shapes: false
      with_cpu: true
      save_path: ./profiling
      start_step: 10
      end_step: 11
      data_simplification: false
      aic_metrics_type: PipeUtilization
  memory_profile:
    enable: false
    start_step: 1
    end_step: 2
    save_path: ./memory_snapshot
    dump_ranks:
    - 0
    stacks: all
    max_entries: null
    mem_info: false
